<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BABUA'S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #08090e;
            padding: 24px;
            overflow-x: hidden;
        }

        /* ===== INTRO OVERLAY ===== */
        #intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(ellipse at 50% 30%, #171a26, #050608);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.9s cubic-bezier(0.77, 0, 0.18, 1), visibility 0.9s ease;
            backdrop-filter: blur(4px);
        }

        #intro-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-content {
            text-align: center;
            padding: 20px 30px;
            position: relative;
        }

        .intro-content .site-badge {
            font-size: 0.9rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #6b6882;
            margin-bottom: 30px;
            font-weight: 300;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: inline-block;
            padding: 8px 28px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
        }

        .intro-content h1 {
            font-size: 5.6rem;
            font-weight: 200;
            letter-spacing: 18px;
            background: linear-gradient(135deg, #f7edc3, #d8b44a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 80px rgba(212, 175, 55, 0.15);
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .intro-content .name-group {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px 28px;
            margin-top: 12px;
        }

        .intro-content .name-group .name {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #e8e2d0;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }

        .intro-content .name-group .divider-symbol {
            font-size: 2rem;
            font-weight: 200;
            color: #d4af37;
            letter-spacing: 4px;
            opacity: 0.7;
        }

        .intro-content .name-group .name.alt {
            background: linear-gradient(135deg, #d4c9b0, #b8a882);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .intro-progress {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .intro-progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4af37, #f5e08a);
            border-radius: 4px;
            transition: width 0.15s linear;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .intro-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            height: 420px;
            border: 1px solid rgba(212, 175, 55, 0.04);
            border-radius: 50%;
            pointer-events: none;
            animation: ringPulse 4s ease-in-out infinite;
        }

        .intro-ring::after {
            content: '';
            position: absolute;
            inset: 40px;
            border: 1px solid rgba(212, 175, 55, 0.02);
            border-radius: 50%;
        }

        @keyframes ringPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.08);
                opacity: 0.8;
            }
        }

        /* ===== MAIN VAULT ===== */
        .vault-container {
            width: 100%;
            max-width: 820px;
            opacity: 0;
            animation: fadeInUp 0.9s 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vault-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 44px;
        }

        .vault-header .logo {
            font-size: 1.4rem;
            font-weight: 200;
            letter-spacing: 12px;
            color: #cbc4ae;
        }

        .vault-header .logo i {
            color: #d4af37;
            margin-right: 14px;
            font-size: 1.6rem;
        }

        .vault-header .status {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #55526b;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .folder-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 44px 60px;
        }

        /* ----- Folder Cards ----- */
        .folder-card {
            flex: 0 1 220px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(8px);
            padding: 32px 16px 28px;
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-align: center;
            position: relative;
            user-select: none;
            overflow: hidden;
        }

        .folder-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 20%, rgba(255, 215, 100, 0.03), transparent 70%);
            pointer-events: none;
            transition: opacity 0.4s;
            opacity: 0;
        }

        .folder-card:hover::before {
            opacity: 1;
        }

        .folder-card:hover {
            transform: translateY(-18px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 32px 60px -20px #000000dd, 0 0 0 1px rgba(212, 175, 55, 0.15) inset;
            background: rgba(255, 255, 255, 0.04);
        }

        .folder-card:active {
            transform: scale(0.94) translateY(-6px);
        }

        .folder-card .corner-glow {
            position: absolute;
            top: -1px;
            right: -1px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at bottom left, rgba(212, 175, 55, 0.08), transparent 70%);
            border-radius: 0 48px 0 0;
            pointer-events: none;
        }

        .folder-card .folder-icon {
            font-size: 5.2rem;
            color: #d4af37;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.7));
            margin-bottom: 6px;
            transition: 0.25s ease;
        }

        .folder-card:hover .folder-icon {
            transform: scale(1.06) translateY(-2px);
            color: #f5dc6a;
            filter: drop-shadow(0 12px 28px rgba(212, 175, 55, 0.2));
        }

        .folder-card .folder-name {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #f0ebd8, #c9b88a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
            line-height: 1.2;
        }

        .folder-card .folder-sub {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #6b6882;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .folder-card .folder-sub i {
            color: #d4af37;
            font-size: 0.6rem;
        }

        .folder-card .hover-arrow {
            display: inline-block;
            margin-left: 6px;
            transition: transform 0.3s ease;
            color: #d4af37;
            font-size: 1rem;
        }

        .folder-card:hover .hover-arrow {
            transform: translateX(6px) scale(1.1);
        }

        .folder-card:nth-child(1) {
            animation: cardFloat 0.8s 0.5s cubic-bezier(0.23, 1, 0.32, 1) both;
        }
        .folder-card:nth-child(2) {
            animation: cardFloat 0.8s 0.7s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        @keyframes cardFloat {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vault-footer {
            margin-top: 56px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #3f3d52;
        }

        .vault-footer .lock-icon {
            color: #d4af37;
            opacity: 0.4;
            font-size: 0.8rem;
        }

        /* ===== PASSWORD MODAL ===== */
        .password-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: modalFadeIn 0.3s ease;
        }

        .password-overlay.active {
            display: flex;
        }

        @keyframes modalFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .password-box {
            background: rgba(18, 21, 30, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 56px;
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .password-box .lock-icon-large {
            font-size: 2.4rem;
            color: #d4af37;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .password-box h3 {
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #e8dfc0;
            margin-bottom: 6px;
        }

        .password-box .sub-text {
            font-size: 0.75rem;
            color: #6b6882;
            letter-spacing: 2px;
            margin-bottom: 28px;
            font-weight: 300;
        }

        .password-box .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .password-box .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            color: #f0ebd8;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 4px;
            outline: none;
            transition: border 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Outfit', sans-serif;
            text-align: center;
        }

        .password-box .input-group input::placeholder {
            color: #3f3d52;
            letter-spacing: 2px;
            font-weight: 200;
            font-size: 0.9rem;
        }

        .password-box .input-group input:focus {
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
        }

        .password-box .error-msg {
            color: #ff6b6b;
            font-size: 0.75rem;
            letter-spacing: 1px;
            min-height: 24px;
            margin-bottom: 12px;
            font-weight: 300;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .password-box .error-msg.show {
            opacity: 1;
        }

        .password-box .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .password-box .btn-row button {
            padding: 12px 32px;
            border-radius: 40px;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .password-box .btn-row .btn-submit {
            background: linear-gradient(135deg, #d4af37, #b8942a);
            color: #0b0c10;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            flex: 1;
        }

        .password-box .btn-row .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
        }

        .password-box .btn-row .btn-cancel {
            background: rgba(255, 255, 255, 0.04);
            color: #8b86a3;
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex: 0.6;
        }

        .password-box .btn-row .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #cbc4ae;
        }

        /* shake animation for wrong password */
        .shake {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-10px);
            }
            40% {
                transform: translateX(10px);
            }
            60% {
                transform: translateX(-6px);
            }
            80% {
                transform: translateX(6px);
            }
        }

        /* ===== ACCESS GRANTED OVERLAY ===== */
        #success-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            animation: modalFadeIn 0.4s ease;
        }

        #success-overlay.active {
            display: flex;
        }

        #success-overlay i {
            font-size: 4rem;
            color: #4ade80;
            filter: drop-shadow(0 0 30px rgba(74, 222, 128, 0.3));
        }

        #success-overlay h2 {
            font-weight: 300;
            letter-spacing: 8px;
            color: #e8dfc0;
            font-size: 1.8rem;
        }

        #success-overlay p {
            color: #6b6882;
            letter-spacing: 3px;
            font-weight: 300;
            font-size: 0.9rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .intro-content h1 {
                font-size: 3.6rem;
                letter-spacing: 12px;
            }
            .intro-content .name-group .name {
                font-size: 2rem;
                letter-spacing: 4px;
            }
            .intro-content .name-group .divider-symbol {
                font-size: 1.4rem;
            }
            .intro-ring {
                width: 280px;
                height: 280px;
            }
            .intro-ring::after {
                inset: 30px;
            }
            .vault-header .logo {
                font-size: 1.1rem;
                letter-spacing: 8px;
            }
            .vault-header .status {
                font-size: 0.6rem;
                padding: 4px 12px;
            }
            .folder-grid {
                gap: 30px 30px;
            }
            .folder-card {
                flex: 0 1 170px;
                padding: 24px 12px 20px;
                border-radius: 36px;
            }
            .folder-card .folder-icon {
                font-size: 4rem;
            }
            .folder-card .folder-name {
                font-size: 2rem;
                letter-spacing: 5px;
            }
            .vault-footer {
                flex-direction: column;
                text-align: center;
                gap: 4px;
            }
            .password-box {
                padding: 32px 24px 28px;
                border-radius: 40px;
            }
            .password-box .btn-row {
                flex-direction: column;
            }
            .password-box .btn-row .btn-cancel {
                flex: 1;
            }
        }

        @media (max-width: 420px) {
            .intro-content h1 {
                font-size: 2.6rem;
                letter-spacing: 8px;
            }
            .intro-content .name-group .name {
                font-size: 1.4rem;
                letter-spacing: 2px;
            }
            .intro-content .name-group .divider-symbol {
                font-size: 1rem;
            }
            .intro-progress {
                width: 140px;
                bottom: 40px;
            }
            .folder-card {
                flex: 0 1 140px;
                padding: 18px 8px 16px;
                border-radius: 28px;
            }
            .folder-card .folder-icon {
                font-size: 3.2rem;
            }
            .folder-card .folder-name {
                font-size: 1.6rem;
                letter-spacing: 3px;
            }
            .vault-header .logo {
                font-size: 0.9rem;
                letter-spacing: 4px;
            }
            .vault-header .status {
                display: none;
            }
            .password-box h3 {
                font-size: 1rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== INTRO OVERLAY ===== -->
    <div id="intro-overlay">
        <div class="intro-ring"></div>
        <div class="intro-content">
            <div class="site-badge"><i class="far fa-compass" style="margin-right: 10px;"></i> INTRO</div>
            <h1>✦A+A✦</h1>
            <div class="name-group">
                <span class="name">AKASH SINGH</span>
                <span class="divider-symbol">✧🌟✧</span>
                <span class="name alt">AMIT ALBUM</span>
            </div>
        </div>
        <div class="intro-progress">
            <div class="bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- ===== MAIN VAULT ===== -->
    <div class="vault-container" id="homePage">
        <div class="vault-header">
            <div class="logo"><i class="fas fa-folder-open"></i> VAULT</div>
            <div class="status"><i class="fas fa-circle" style="color: #4ade80; font-size: 0.4rem; margin-right: 8px;"></i> secure</div>
        </div>

        <div class="folder-grid">
            <!-- AMIT folder -->
            <div class="folder-card" id="folder-amit" data-link="https://drive.google.com/drive/folders/1ykPuFbKSblU17mB5UjxsKVz8jlzNVtyb">
                <div class="corner-glow"></div>
                <div class="folder-icon"><i class="fas fa-folder"></i></div>
                <div class="folder-name">AMIT</div>
                <div class="folder-sub">
                    <i class="fas fa-star"></i> album
                    <span class="hover-arrow"><i class="fas fa-arrow-right"></i></span>
                </div>
            </div>

            <!-- AKASH folder -->
            <div class="folder-card" id="folder-akash" data-link="https://drive.google.com/drive/folders/1MsnVrO_-jr5Wjo0IhDzhquZ0bgKZQdNG">
                <div class="corner-glow"></div>
                <div class="folder-icon"><i class="fas fa-folder-open"></i></div>
                <div class="folder-name">AKASH</div>
                <div class="folder-sub">
                    <i class="fas fa-crown"></i> collection
                    <span class="hover-arrow"><i class="fas fa-arrow-right"></i></span>
                </div>
            </div>
        </div>

        <div class="vault-footer">
            <span><i class="fas fa-lock lock-icon" style="margin-right: 6px;"></i> premium access</span>
            <span>© 2026 · curated</span>
        </div>
    </div>

    <!-- ===== PASSWORD MODAL ===== -->
    <div class="password-overlay" id="passwordModal">
        <div class="password-box" id="passwordBox">
            <div class="lock-icon-large"><i class="fas fa-key"></i></div>
            <h3>UNLOCK FOLDER</h3>
            <p class="sub-text">enter access code</p>

            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="• • • • • • • • • •" inputmode="numeric" maxlength="20" autocomplete="off" />
            </div>

            <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle" style="margin-right: 6px;"></i>Ban tej 💔 block kar de hamra dost 🥹 </div>

            <div class="btn-row">
                <button class="btn-cancel" id="cancelBtn">cancel</button>
                <button class="btn-submit" id="submitBtn">unlock</button>
            </div>
        </div>
    </div>

    <!-- ===== ACCESS GRANTED OVERLAY ===== -->
    <div id="success-overlay">
        <i class="fas fa-check-circle"></i>
        <h2>ACCESS GRANTED</h2>
        <p>redirecting to vault ...</p>
    </div>

    <script>
        (function() {
            'use strict';

            // ----- VALID PASSWORDS -----
            const VALID_PASSWORDS = ['9708571680', '224068123420', '9708571680'];

            // ----- DOM REFS -----
            const introOverlay = document.getElementById('intro-overlay');
            const progressBar = document.getElementById('progress-bar');

            const passwordModal = document.getElementById('passwordModal');
            const passwordInput = document.getElementById('passwordInput');
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelBtn');

            const successOverlay = document.getElementById('success-overlay');

            let targetLink = '';

            // ----- 1. INTRO -----
            if (introOverlay && progressBar) {
                let width = 0;
                const interval = setInterval(() => {
                    width += 1.2;
                    if (width >= 100) {
                        width = 100;
                        clearInterval(interval);
                    }
                    progressBar.style.width = width + '%';
                }, 20);

                setTimeout(() => {
                    progressBar.style.width = '100%';
                    clearInterval(interval);
                    introOverlay.classList.add('hidden');
                }, 2000);

                setTimeout(() => {
                    if (!introOverlay.classList.contains('hidden')) {
                        introOverlay.classList.add('hidden');
                    }
                }, 2400);
            } else {
                if (introOverlay) setTimeout(() => introOverlay.classList.add('hidden'), 2000);
            }

            // ----- 2. PASSWORD MODAL -----
            function showModal(link) {
                targetLink = link;
                passwordModal.classList.add('active');
                passwordInput.value = '';
                errorMsg.classList.remove('show');
                passwordInput.classList.remove('shake');
                setTimeout(() => passwordInput.focus(), 100);
            }

            function hideModal() {
                passwordModal.classList.remove('active');
                passwordInput.value = '';
                errorMsg.classList.remove('show');
                passwordInput.classList.remove('shake');
                // ⚠️ DO NOT clear targetLink here — it's needed for redirect!
            }

            function showSuccessAndRedirect() {
                const link = targetLink; // store before hiding
                hideModal();
                successOverlay.classList.add('active');

                // Redirect after 800ms (within a second)
                setTimeout(() => {
                    if (link) {
                        window.location.href = link;
                    } else {
                        console.warn('No link to redirect to.');
                    }
                }, 800);
            }

            function validatePassword() {
                const entered = passwordInput.value.trim();
                if (VALID_PASSWORDS.includes(entered)) {
                    showSuccessAndRedirect();
                } else {
                    errorMsg.classList.add('show');
                    passwordInput.classList.remove('shake');
                    void passwordInput.offsetWidth;
                    passwordInput.classList.add('shake');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            // ----- 3. FOLDER CLICK -----
            const folderAmit = document.getElementById('folder-amit');
            const folderAkash = document.getElementById('folder-akash');

            function handleFolderClick(e) {
                const card = e.currentTarget;
                const link = card.getAttribute('data-link');
                if (link) {
                    showModal(link);
                } else {
                    console.warn('No drive link defined.');
                }
            }

            [folderAmit, folderAkash].forEach((folder) => {
                if (!folder) return;
                folder.addEventListener('click', handleFolderClick);
                folder.setAttribute('role', 'button');
                folder.setAttribute('tabindex', '0');
                folder.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleFolderClick(e);
                    }
                });
            });

            // ----- 4. MODAL EVENTS -----
            submitBtn.addEventListener('click', validatePassword);

            cancelBtn.addEventListener('click', () => {
                targetLink = ''; // clear only on explicit cancel
                hideModal();
            });

            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    validatePassword();
                } else if (e.key === 'Escape') {
                    targetLink = '';
                    hideModal();
                }
            });

            passwordModal.addEventListener('click', (e) => {
                if (e.target === passwordModal) {
                    targetLink = '';
                    hideModal();
                }
            });

            passwordInput.addEventListener('input', () => {
                errorMsg.classList.remove('show');
                passwordInput.classList.remove('shake');
            });

            // ----- 5. SUCCESS OVERLAY: click to dismiss (just in case) -----
            successOverlay.addEventListener('click', () => {
                // if redirect fails, user can click to dismiss
                successOverlay.classList.remove('active');
            });

            // ----- 6. TOUCH FIX -----
            document.querySelectorAll('.folder-card').forEach(el => {
                el.addEventListener('touchstart', () => {}, { passive: true });
            });

        })();
    </script>

</body>
</html>
